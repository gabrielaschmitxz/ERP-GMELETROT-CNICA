{% extends "base.html" %}

{% block title %}BDI - ERP Eletrotécnica{% endblock %}

{% block content %}
<h2 class="mb-4"><i class="bi bi-calculator"></i> BDI (Benefícios e Despesas Indiretas)</h2>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Novo BDI</h5>
                <form method="POST">
                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição *</label>
                        <input type="text" class="form-control" id="descricao" name="descricao" required>
                    </div>
                    <div class="mb-3">
                        <label for="valor" class="form-label">Valor (R$)</label>
                        <input type="text" class="form-control" id="valor" name="valor" 
                               value="0.00" placeholder="0.00">
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Salvar
                    </button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">BDI Cadastrados</h5>
                <div class="table-responsive">
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>Descrição</th>
                                <th>Valor</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for bdi in bdi_list %}
                            <tr>
                                <td>{{ bdi.descricao }}</td>
                                <td>R$ {{ "%.2f"|format(bdi.valor) }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
