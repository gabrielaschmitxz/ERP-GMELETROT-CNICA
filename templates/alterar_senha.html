{% extends "base.html" %}

{% block title %}Alterar Senha - ERP Eletrotécnica{% endblock %}

{% block content %}
<h2 class="mb-4"><i class="bi bi-key"></i> Alterar Senha</h2>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="senha_atual" class="form-label">Senha Atual *</label>
                <input type="password" class="form-control" id="senha_atual" name="senha_atual" required>
            </div>
            <div class="mb-3">
                <label for="senha_nova" class="form-label">Nova Senha *</label>
                <input type="password" class="form-control" id="senha_nova" name="senha_nova" required>
            </div>
            <div class="mb-3">
                <label for="senha_confirmar" class="form-label">Confirmar Nova Senha *</label>
                <input type="password" class="form-control" id="senha_confirmar" name="senha_confirmar" required>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> Alterar Senha
                </button>
                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
                    <i class="bi bi-x-circle"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
