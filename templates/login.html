{% extends "base.html" %}

{% block title %}Login - ERP Eletrotécnica{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">
                    <i class="bi bi-lightning-charge text-primary"></i> GM Eletrotécnica
                </h3>
                <p class="text-center text-muted mb-4">Sistema de Gestão Empresarial</p>
                
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuário</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Entrar
                    </button>
                </form>
                
                <div class="mt-3 text-center">
                    <small class="text-muted">Usuário padrão: admin | Senha: admin123</small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
